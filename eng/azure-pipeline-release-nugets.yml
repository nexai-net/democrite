# .NET Desktop

# Build and run tests for .NET Desktop or Windows classic desktop solutions.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/windows/dot-net

trigger: none

pool:
  vmImage: 'windows-latest'

parameters:
  - name: release_target
    displayName: define the nuget export target
    type: string
    default: Azure
    values: 
      - Azure
      - Nuget
      
  - name: export_symbols
    displayName: Define if symbols must be exported
    type: boolean
    default: true

variables:
  - group: democrite-frameworks-variables

  - ${{ if eq(parameters.release_target, 'Azure') }}:
    - group: nuget-azure-api
  
  - ${{ if eq(parameters.release_target, 'Nuget') }}:
    - group: nuget-org-api-nexai

  - name: pkg_push_filter
    ${{ if parameters.export_symbols }}:
      value: "*.symbols.nupkg"
    ${{ else }}:
      value: "*.nupkg"

  # Democrite framework version (same as SharedFrameworkAssmblyInfo.props)
  #TO-DO from Opus 5.5 Package version hard-coded twice : The value 1.0.0 is duplicated here and in SharedFrameworkAssmblyInfo.props (Version, AssemblyVersion, FileVersion, InformationalVersion), so the two can drift apart and releases need manual edits. Use a single source of truth such as a pipeline parameter or variable passed as /p:Version, or a tool like Nerdbank.GitVersioning or MinVer.
  - name: FinalPkgVersion
    value: 1.0.0

resources:
  repositories:
    - repository: tpl
      type: git
      name: Yaml-Templates
#      ref: refs/heads/dev

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET Core SDK'
    inputs:
      version: 8.x
      includePreviewVersions: true # Required for preview versions

  - task: NuGetAuthenticate@1

  - template: Templates/dotnet/nuget-steps.yaml@tpl
    parameters:
      package_version: $(FinalPkgVersion)
      include_symbols: ${{ parameters.export_symbols }}
      solution_file_name: $(solution_file_name)
      nuget_depo: $(nuget_depo)
      nuget_package_filter: $(pkg_push_filter)
      secret_api_key: $(secret_api_key)
