# .NET Desktop

# Build and run tests for .NET Desktop or Windows classic desktop solutions.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/windows/dot-net

trigger: none

#TO-DO from Opus 5.5 PR validation targets non-existent branches : PR builds trigger only for 'main' and 'dev', but the repository's main branch is 'master', and the Linux job is commented out. PRs to master are never validated and cross-platform builds are never tested. Add master to the branch filter, re-enable the Linux job, and drop includePreviewVersions: true so SDK versions stay reproducible.
pr:
  autoCancel: true
  branches:
    include:
      - main
      - dev

resources:
  repositories:
    - repository: Yaml-Templates
      type: git
      name: Yaml-Templates
#      ref: refs/heads/dev

parameters:
  - name: debug_display
    displayName: Define debug information are requested
    type: boolean
    default: false

jobs:
  - job: Window
    pool:
      vmImage: 'windows-latest'

    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET Core SDK'
        inputs:
          version: 8.x
          includePreviewVersions: true # Required for preview versions

      - template: /Templates/dotnet/full-build-test-export-steps.yaml@Yaml-Templates
        parameters: 
          debug_display: ${{ parameters.debug_display }}
          solution_file_name: $(solution-name)
          exclude_from_coverage_regex: '(((Orleans.)|(h.)|(coverlet.))[a-zA-Z.]+.dll)|(Democrite.[a-zA-Z.]+.unittests.dll)'

